[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinkerllm"
version = "0.1.0"
description = "A pure-PyTorch LLM architecture research workbench."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
